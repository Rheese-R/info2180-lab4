
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INFO2180 Lab 4 - Superheroes</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Superhero Search</h1>
    </header>

    <main>
        <h2>Find a Superhero</h2>
        <p>Enter a superhero's name or alias below.</p>

        <form id="search-form">
            <label for="query">Superhero name or alias:</label>
            <input type="text" id="query" name="query" />
            <button id="search" type="submit">Search</button>
        </form>

        <div id="result"></div>
    </main>
</body>
</html>
